<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ALFRED</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap');
  :root { --cyan:#12d3ff; --cyan2:#7fecff; --linea:#0e5866; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#000305; color:#e6fbff; font-family:'Orbitron',sans-serif; overflow:hidden; }
  #fondo { position:fixed; inset:-4%; background:url('/static/fondo.png') center/cover no-repeat; animation:bg 34s ease-in-out infinite; z-index:0; }
  #velo { position:fixed; inset:0; background:radial-gradient(circle at 50% 40%, rgba(0,3,5,.35), rgba(0,3,5,.82)); z-index:1; }
  #scan { position:fixed; left:0; right:0; height:90px; top:-90px; background:linear-gradient(rgba(18,211,255,.10), transparent); z-index:2; animation:scan 5s linear infinite; }
  .wrap { position:relative; z-index:3; height:100%; display:flex; flex-direction:column; }
  @keyframes bg { 0%,100%{ transform:scale(1) translate(0,0);} 50%{ transform:scale(1.09) translate(-2%,-2%);} }
  @keyframes scan { 0%{ top:-90px;} 100%{ top:110%;} }

  /* login */
  #login { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:rgba(0,3,5,.75); }
  #login .caja { width:78%; max-width:320px; border:1px solid var(--linea); background:rgba(18,211,255,.05); padding:22px 18px; text-align:center; }
  #login h1 { font-size:26px; letter-spacing:8px; color:var(--cyan2); text-shadow:0 0 12px var(--cyan); margin:0 0 4px; }
  #login .sub { font-size:9px; letter-spacing:3px; color:#0aa5c2; margin-bottom:16px; }
  input { width:100%; background:#02141a; border:1px solid var(--linea); color:#e6fbff; padding:12px; font-family:'Orbitron'; letter-spacing:2px; text-align:center; }
  input:focus { outline:none; border-color:var(--cyan); box-shadow:0 0 12px rgba(18,211,255,.4); }
  button { width:100%; margin-top:12px; background:rgba(18,211,255,.08); border:1px solid var(--cyan); color:var(--cyan2); padding:13px; font-family:'Orbitron'; letter-spacing:3px; }
  button:active { transform:scale(.98); }
  #login .err { color:#ff6a6a; font-size:11px; letter-spacing:1px; min-height:14px; margin-top:8px; }

  header { text-align:center; padding:20px 0 6px; }
  header h1 { margin:0; font-size:26px; letter-spacing:9px; color:var(--cyan2); text-shadow:0 0 12px var(--cyan), 0 0 30px #0891b2; }
  header .sub { font-size:9px; letter-spacing:3px; color:#0aa5c2; }
  .estado { text-align:center; font-size:10px; letter-spacing:3px; color:#38e0ff; min-height:16px; text-shadow:0 0 10px var(--cyan); }
  .nucleo { flex:1; display:flex; align-items:center; justify-content:center; }
  .core .cw { transform-origin:100px 100px; animation:cw 16s linear infinite; }
  .core .ccw { transform-origin:100px 100px; animation:ccw 11s linear infinite; }
  .core .fast { transform-origin:100px 100px; animation:cw 6s linear infinite; }
  .cargando .core .cw { animation-duration:5s; }
  .cargando .core .fast { animation-duration:1.6s; }
  @keyframes cw { to { transform:rotate(360deg);} }
  @keyframes ccw { to { transform:rotate(-360deg);} }

  main { padding:0 16px; }
  .panel { position:relative; border:1px solid var(--linea); padding:9px 11px; margin-bottom:10px; background:rgba(18,211,255,.05); }
  .panel .b1,.panel .b2 { position:absolute; width:10px; height:10px; }
  .panel .b1 { top:-1px; left:-1px; border-top:2px solid var(--cyan); border-left:2px solid var(--cyan); }
  .panel .b2 { bottom:-1px; right:-1px; border-bottom:2px solid var(--cyan); border-right:2px solid var(--cyan); }
  .rot { font-size:8px; letter-spacing:2px; color:#0aa5c2; }
  .txt { font-size:13px; color:#e6fbff; font-family:Consolas,monospace; min-height:20px; white-space:pre-wrap; }
  .interim { color:#7fb6c6; font-style:italic; }
  .controles { display:flex; gap:10px; padding:12px 16px 22px; }
  .controles button { background:rgba(18,211,255,.06); border:1px solid var(--linea); color:#cdf6ff; padding:14px; letter-spacing:2px; font-size:12px; }
  #escuchar.on { border-color:var(--cyan); color:var(--cyan2); box-shadow:0 0 16px rgba(18,211,255,.4); }
</style>
</head>
<body>
  <div id="fondo"></div>
  <div id="velo"></div>
  <div id="scan"></div>

  <div id="login">
    <div class="caja">
      <h1>ALFRED</h1>
      <div class="sub">ACCESO RESTRINGIDO</div>
      <input id="clave" type="password" placeholder="CLAVE" autocomplete="off">
      <button id="entrar">ACCEDER</button>
      <div class="err" id="err"></div>
    </div>
  </div>

  <div class="wrap" id="app" style="display:none;">
    <header>
      <h1>ALFRED</h1>
      <div class="sub">SYS.ONLINE · NÚCLEO 100%</div>
    </header>
    <div class="estado" id="estado">Toca “Activar” para comenzar</div>

    <div class="nucleo" id="nucleo">
      <svg class="core" viewBox="0 0 200 200" width="230" height="230">
        <g fill="none" stroke-linecap="round">
          <circle cx="100" cy="100" r="90" stroke="#0e6c82" stroke-width="1" stroke-dasharray="2 6"/>
          <g class="cw"><circle cx="100" cy="100" r="80" stroke="#12d3ff" stroke-width="2" stroke-dasharray="40 12 8 12" opacity=".85"/></g>
          <g class="ccw"><circle cx="100" cy="100" r="66" stroke="#38e0ff" stroke-width="1.5" stroke-dasharray="4 10"/><path d="M100,34 l4,8 l-8,0 Z" fill="#7fecff"/></g>
          <g class="fast"><path d="M100,52 A48,48 0 0 1 148,100" stroke="#7fecff" stroke-width="2.5" opacity=".9"/></g>
          <circle cx="100" cy="100" r="34" stroke="#0e88a6" stroke-width="1"/>
          <rect x="86" y="86" width="28" height="28" rx="4" fill="#04222a" stroke="#12d3ff" stroke-width="1.5"/>
        </g>
      </svg>
    </div>

    <main>
      <div class="panel"><span class="b1"></span><span class="b2"></span>
        <div class="rot">&gt; ENTRADA</div><div class="txt" id="pregunta">—</div>
      </div>
      <div class="panel"><span class="b1"></span><span class="b2"></span>
        <div class="rot">&gt; ALFRED</div><div class="txt" id="respuesta">—</div>
      </div>
    </main>

    <div class="controles">
      <button id="escuchar">ACTIVAR “OYE ALFRED”</button>
      <button id="hablar">PREGUNTAR</button>
    </div>
  </div>

<script>
const $ = id => document.getElementById(id);
const estado = t => $("estado").textContent = t;
let CLAVE = localStorage.getItem("alfred_key") || "";

async function verificar(clave){
  try{
    const r = await fetch("/auth", {method:"POST", headers:{"X-Alfred-Key":clave}});
    const d = await r.json(); return !!d.ok;
  }catch(e){ return false; }
}
function entrarApp(){ $("login").style.display="none"; $("app").style.display="flex"; }

$("entrar").addEventListener("click", async () => {
  const c = $("clave").value.trim();
  $("err").textContent = "verificando…";
  if (await verificar(c)){ CLAVE=c; localStorage.setItem("alfred_key", c); $("err").textContent=""; entrarApp(); }
  else { $("err").textContent = "Clave incorrecta"; }
});
$("clave").addEventListener("keydown", e => { if (e.key==="Enter") $("entrar").click(); });
(async () => { if (CLAVE && await verificar(CLAVE)) entrarApp(); })();

/* ---- voz ---- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec=null, activo=false, procesando=false, hablando=false, esperando=false;
function cargando(on){ $("app").classList.toggle("cargando", on); }

function hablar(texto){
  return new Promise(res => {
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(texto);
      u.lang="es-ES"; u.rate=.98; u.pitch=.9;
      const vs = speechSynthesis.getVoices();
      const v = vs.find(x=>/es/i.test(x.lang) && /male|jorge|alvaro|diego|carlos/i.test(x.name)) || vs.find(x=>/es/i.test(x.lang));
      if (v) u.voice=v;
      hablando=true; estado("ALFRED RESPONDE…");
      let ok=false; const fin=()=>{ if(!ok){ok=true;hablando=false;res();} };
      u.onend=fin; u.onerror=fin; speechSynthesis.speak(u);
      setTimeout(fin, Math.min(22000, 3000+texto.length*90));
    }catch(e){ hablando=false; res(); }
  });
}

async function consultar(texto){
  procesando=true; esperando=false;
  $("pregunta").classList.remove("interim"); $("pregunta").textContent=texto;
  $("respuesta").textContent="";
  estado("PROCESANDO…"); cargando(true);
  try{
    const ctrl=new AbortController(); const al=setTimeout(()=>ctrl.abort(),45000);
    const r=await fetch("/preguntar",{method:"POST",headers:{"Content-Type":"application/json","X-Alfred-Key":CLAVE},body:JSON.stringify({texto}),signal:ctrl.signal});
    clearTimeout(al);
    if (r.status===401){ cargando(false); $("respuesta").textContent="Sesión expirada. Recarga e ingresa la clave."; return; }
    const d=await r.json(); const t=d.respuesta||"Sin respuesta.";
    cargando(false); $("respuesta").textContent=t; await hablar(t);
  }catch(e){
    cargando(false);
    const m=(e&&e.name==="AbortError")?"Tardó demasiado, señor.":"No pude contactar al servidor.";
    $("respuesta").textContent=m; estado(m);
  }finally{ procesando=false; cargando(false); if(activo) arrancar(); else estado("LISTO"); }
}

function procesarFinal(texto){
  const t=(texto||"").trim(); if(!t) return;
  if(esperando){ consultar(t); return; }
  const i=t.toLowerCase().lastIndexOf("alfred"); if(i===-1) return;
  const q=t.slice(i+6).replace(/^[\s,.:;¿?!¡-]+/,"").trim();
  if(q.length>=2) consultar(q);
  else { esperando=true; estado("DÍGAME, SEÑOR…"); hablar("Dígame, señor."); }
}

function arrancar(){
  if(!SR){ estado("Usa Google Chrome"); return; }
  if(procesando||hablando) return;
  try{
    rec=new SR(); rec.lang="es-ES"; rec.continuous=true; rec.interimResults=true;
    rec.onstart=()=>estado(esperando?"DÍGAME, SEÑOR…":"ESCUCHANDO “OYE ALFRED”…");
    rec.onresult=e=>{
      let interim="",final="";
      for(let k=e.resultIndex;k<e.results.length;k++){ const s=e.results[k][0].transcript; if(e.results[k].isFinal) final+=s; else interim+=s; }
      if(interim){ $("pregunta").classList.add("interim"); $("pregunta").textContent=interim; }
      if(final){ try{rec.stop();}catch(x){} procesarFinal(final); }
    };
    rec.onerror=()=>{};
    rec.onend=()=>{ if(activo&&!procesando&&!hablando) setTimeout(arrancar,300); };
    rec.start();
  }catch(e){ setTimeout(arrancar,800); }
}

$("escuchar").addEventListener("click",()=>{
  speechSynthesis&&speechSynthesis.getVoices();
  activo=!activo; $("escuchar").classList.toggle("on",activo);
  $("escuchar").textContent=activo?"ESCUCHANDO… (PAUSAR)":"ACTIVAR “OYE ALFRED”";
  if(activo) arrancar(); else { esperando=false; estado("PAUSADO"); try{rec&&rec.stop();}catch(e){} }
});
$("hablar").addEventListener("click",()=>{
  if(!SR){ estado("Usa Google Chrome"); return; }
  const antes=activo; activo=false; try{rec&&rec.stop();}catch(e){}
  const uno=new SR(); uno.lang="es-ES"; uno.continuous=true; uno.interimResults=true;
  estado("HABLA AHORA…"); let dicho="";
  uno.onresult=e=>{ let interim=""; for(let k=e.resultIndex;k<e.results.length;k++){ const s=e.results[k][0].transcript; if(e.results[k].isFinal) dicho+=s; else interim+=s; } $("pregunta").classList.add("interim"); $("pregunta").textContent=(dicho+" "+interim).trim(); };
  uno.onend=()=>{ const q=dicho.trim(); if(q) consultar(q).then(()=>{activo=antes; if(activo)arrancar();}); else { estado("NO TE ESCUCHÉ"); activo=antes; if(activo)arrancar(); } };
  uno.onerror=()=>estado("NO TE ESCUCHÉ");
  uno.start();
});
</script>
</body>
</html>
