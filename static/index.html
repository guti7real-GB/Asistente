<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Alfred</title>
<style>
  :root { --oro:#c9a227; --fondo:#0a0c10; --panel:#12161c; --linea:#1c2230; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fondo); color:#e8eaed;
         font-family:-apple-system,Segoe UI,Roboto,sans-serif; }
  header { padding:16px; text-align:center; border-bottom:1px solid var(--linea); }
  header h1 { margin:0; font-size:22px; letter-spacing:4px; color:var(--oro); font-weight:500; }
  header .sub { font-size:12px; color:#7b8494; letter-spacing:1px; }
  .controles { display:flex; gap:10px; padding:14px 16px; }
  button { flex:1; padding:15px; border-radius:12px; border:1px solid #2a3242;
           background:#161b23; color:#e8eaed; font-size:15px; }
  #escuchar.on { background:var(--oro); color:#141414; border-color:var(--oro); }
  .estado { display:flex; align-items:center; justify-content:center; gap:8px;
            font-size:13px; color:#8b93a3; padding:2px 16px 10px; text-align:center; min-height:20px; }
  .punto { width:9px; height:9px; border-radius:50%; background:#3a4252; flex:none; }
  .punto.oye { background:#2ec26b; box-shadow:0 0 10px #2ec26b; animation:lat 1.2s infinite; }
  .spin { width:15px; height:15px; border:2px solid #2a3242; border-top-color:var(--oro);
          border-radius:50%; animation:gira .7s linear infinite; flex:none; display:none; }
  .cargando .spin { display:inline-block; }
  @keyframes gira { to { transform:rotate(360deg); } }
  @keyframes lat { 50% { opacity:.35; } }
  main { padding:4px 16px 24px; display:flex; flex-direction:column; gap:12px; }
  .burbuja { background:var(--panel); border:1px solid var(--linea); border-radius:14px; padding:13px 15px; }
  .rot { font-size:11px; letter-spacing:1px; text-transform:uppercase; margin-bottom:6px; }
  #pregunta .rot { color:#5b93d6; }
  #respuesta .rot { color:var(--oro); }
  .txt { font-size:16px; line-height:1.5; min-height:22px; white-space:pre-wrap; }
  .interim { color:#8b93a3; font-style:italic; }
  .barra { height:3px; background:var(--linea); border-radius:3px; overflow:hidden; margin-top:10px; display:none; }
  .cargando .barra { display:block; }
  .barra i { display:block; height:100%; width:35%; background:var(--oro); border-radius:3px;
             animation:corre 1.1s ease-in-out infinite; }
  @keyframes corre { 0%{margin-left:-35%;} 100%{margin-left:100%;} }
</style>
</head>
<body>
  <header>
    <h1>ALFRED</h1>
    <div class="sub">a su servicio, señor</div>
  </header>

  <div class="controles">
    <button id="escuchar">Activar “Oye Alfred”</button>
    <button id="hablar">Preguntar ahora</button>
  </div>

  <div class="estado" id="estado-box">
    <span class="punto" id="punto"></span>
    <span class="spin"></span>
    <span id="estado">Toca “Activar” para comenzar</span>
  </div>

  <main>
    <div class="burbuja" id="pregunta">
      <div class="rot">Usted dijo</div>
      <div class="txt" id="pregunta-txt">—</div>
    </div>
    <div class="burbuja" id="respuesta">
      <div class="rot">Alfred</div>
      <div class="txt" id="respuesta-txt">—</div>
      <div class="barra"><i></i></div>
    </div>
  </main>

<script>
const $ = id => document.getElementById(id);
const estado = t => $("estado").textContent = t;
const box = $("estado-box"), resp = $("respuesta");
function cargando(on){ box.classList.toggle("cargando", on); resp.classList.toggle("cargando", on); }
function oyendo(on){ $("punto").classList.toggle("oye", on); }

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, activo = false, procesando = false, hablando = false, esperando = false;

function hablar(texto){
  return new Promise(res => {
    try{
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(texto);
      u.lang = "es-ES"; u.rate = 0.98; u.pitch = 0.9;
      const vs = window.speechSynthesis.getVoices();
      const v = vs.find(x => /es/i.test(x.lang) && /male|hombre|jorge|alvaro|diego|carlos/i.test(x.name))
             || vs.find(x => /es/i.test(x.lang));
      if (v) u.voice = v;
      hablando = true; oyendo(false); estado("Alfred responde…");
      let listo = false;
      const fin = () => { if (!listo){ listo = true; hablando = false; res(); } };
      u.onend = fin; u.onerror = fin;
      window.speechSynthesis.speak(u);
      setTimeout(fin, Math.min(22000, 3000 + texto.length * 90));
    }catch(e){ hablando = false; res(); }
  });
}

async function consultar(texto){
  procesando = true; esperando = false;
  $("pregunta-txt").classList.remove("interim");
  $("pregunta-txt").textContent = texto;
  $("respuesta-txt").textContent = "";
  estado("Alfred está pensando…"); cargando(true);
  try{
    const ctrl = new AbortController();
    const alarma = setTimeout(() => ctrl.abort(), 45000);
    const r = await fetch("/preguntar", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({texto}), signal: ctrl.signal
    });
    clearTimeout(alarma);
    const d = await r.json();
    const t = d.respuesta || "Sin respuesta.";
    cargando(false);
    $("respuesta-txt").textContent = t;
    await hablar(t);
  }catch(e){
    cargando(false);
    const msg = (e && e.name === "AbortError")
      ? "Tardó demasiado, señor. Intentemos de nuevo."
      : "No pude contactar al servidor.";
    $("respuesta-txt").textContent = msg;
    estado(msg);
  }finally{
    procesando = false; cargando(false);
    if (activo) arrancar();
    else estado("Listo");
  }
}

function procesarFinal(texto){
  const t = (texto || "").trim();
  if (!t) return;
  if (esperando){ consultar(t); return; }
  const i = t.toLowerCase().lastIndexOf("alfred");
  if (i === -1) return;
  const pregunta = t.slice(i + 6).replace(/^[\s,.:;¿?!¡-]+/, "").trim();
  if (pregunta.length >= 2){ consultar(pregunta); }
  else { esperando = true; estado("Dígame, señor…"); hablar("Dígame, señor."); }
}

function arrancar(){
  if (!SR){ estado("Usa Google Chrome para el reconocimiento de voz."); return; }
  if (procesando || hablando) return;
  try{
    rec = new SR();
    rec.lang = "es-ES"; rec.continuous = true; rec.interimResults = true;
    rec.onstart = () => { oyendo(true); estado(esperando ? "Dígame, señor…" : "Escuchando “Oye Alfred”…"); };
    rec.onresult = e => {
      let interim = "", final = "";
      for (let k = e.resultIndex; k < e.results.length; k++){
        const seg = e.results[k][0].transcript;
        if (e.results[k].isFinal) final += seg; else interim += seg;
      }
      if (interim){
        $("pregunta-txt").classList.add("interim");
        $("pregunta-txt").textContent = interim;
      }
      if (final){ try{ rec.stop(); }catch(x){} procesarFinal(final); }
    };
    rec.onerror = () => {};
    rec.onend = () => { oyendo(false); if (activo && !procesando && !hablando && !esperando) setTimeout(arrancar, 300);
                        else if (activo && esperando && !procesando && !hablando) setTimeout(arrancar, 300); };
    rec.start();
  }catch(e){ setTimeout(arrancar, 800); }
}

$("escuchar").addEventListener("click", () => {
  window.speechSynthesis && window.speechSynthesis.getVoices();
  activo = !activo;
  $("escuchar").classList.toggle("on", activo);
  $("escuchar").textContent = activo ? "Escuchando… (tocar para pausar)" : "Activar “Oye Alfred”";
  if (activo) arrancar();
  else { esperando = false; estado("Pausado"); oyendo(false); try{ rec && rec.stop(); }catch(e){} }
});

$("hablar").addEventListener("click", () => {
  if (!SR){ estado("Usa Google Chrome para el reconocimiento de voz."); return; }
  const antes = activo; activo = false;
  try{ rec && rec.stop(); }catch(e){}
  const uno = new SR();
  uno.lang = "es-ES"; uno.continuous = true; uno.interimResults = true;
  estado("Habla ahora…"); oyendo(true);
  let dicho = "";
  uno.onresult = e => {
    let interim = "";
    for (let k = e.resultIndex; k < e.results.length; k++){
      const seg = e.results[k][0].transcript;
      if (e.results[k].isFinal) dicho += seg; else interim += seg;
    }
    $("pregunta-txt").classList.add("interim");
    $("pregunta-txt").textContent = (dicho + " " + interim).trim();
  };
  uno.onend = () => { oyendo(false); const q = dicho.trim();
    if (q) consultar(q).then(() => { activo = antes; if (activo) arrancar(); });
    else { estado("No te escuché, intenta de nuevo."); activo = antes; if (activo) arrancar(); } };
  uno.onerror = () => { oyendo(false); estado("No te escuché, intenta de nuevo."); };
  uno.start();
});
</script>
</body>
</html>
